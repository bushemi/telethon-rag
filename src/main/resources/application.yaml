server:
  port: ${SERVER_PORT:5001}
  tomcat:
    threads:
      max: ${MAX_TOMCAT_THREADS:10}
    max-connections: ${MAX_TOMCAT_CONNECTIONS:20}

spring:
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://192.168.88.222:5432/telethon}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:60000}
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://192.168.88.222:151}

telethon:
  service:
    http-scheme: ${TELETHON_SERVICE_HTTP_SCHEME:http}
    host: ${TELETHON_SERVICE_HOST:192.168.88.222}
    port: ${TELETHON_SERVICE_PORT:5000}

telegram:
  channel:
    id: ${TELEGRAM_CHANNEL_ID:-1001319248631}